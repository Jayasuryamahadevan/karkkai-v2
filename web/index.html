<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe4">
  <meta name="description" content="Chillian — a quiet, local-first Tamil workspace for translation, voice, spelling, word discovery and PDF editing.">
  <title>Chillian — Tamil workspace</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <a class="brand-link" href="#/home" aria-label="Chillian home">
          <span class="brand-mark" aria-hidden="true">ழ</span>
          <span class="brand-type">
            <span class="brand-name">Chillian</span>
            <span class="brand-sub">Tamil workspace</span>
          </span>
        </a>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close navigation">
          <span data-icon="x"></span>
        </button>
      </div>

      <nav class="nav" id="mainNav" aria-label="Workspace"></nav>

      <div class="sidebar-foot">
        <div class="connection-card" id="connectionCard">
          <span class="status-dot" id="statusDot"></span>
          <div>
            <strong id="connectionTitle">Checking connection</strong>
            <span id="connectionText">Waking up the local server</span>
          </div>
        </div>
        <button class="settings-btn" id="openSettings" type="button">
          <span data-icon="settings"></span>
          <span>Settings</span>
          <kbd>⌘ ,</kbd>
        </button>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open navigation">
            <span data-icon="menu"></span>
          </button>
          <div class="page-id">
            <span class="page-kicker">Chillian</span>
            <h2 class="page-title" id="pageTitle">Home</h2>
          </div>
        </div>

        <div class="topbar-right">
          <form class="quick-search" id="quickSearch" role="search">
            <span data-icon="search" aria-hidden="true"></span>
            <input id="quickSearchInput" type="search" placeholder="Find a Tamil or English word…" autocomplete="off" aria-label="Find a word">
            <kbd>↵</kbd>
          </form>
          <div class="net-pill" id="netPill" title="Online engines power translation and speech">
            <span class="status-dot"></span>
            <span id="netLabel">Online</span>
          </div>
          <button class="icon-btn settings-top" id="openSettingsTop" aria-label="Open settings">
            <span data-icon="settings"></span>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-layer" id="settingsLayer" hidden>
    <div class="drawer-backdrop" id="settingsBackdrop"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="drawer-head">
        <div>
          <span class="eyebrow">Preferences</span>
          <h2 id="settingsTitle">Settings</h2>
        </div>
        <button class="icon-btn" id="closeSettings" aria-label="Close settings">
          <span data-icon="x"></span>
        </button>
      </header>
      <div class="drawer-body" id="settingsBody"></div>
    </aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <template id="iconSprite">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
      <symbol id="i-translate" viewBox="0 0 24 24"><path d="M4 5h8"/><path d="M8 3v2c0 4-1.8 7-5 9"/><path d="M5 9c.8 2.5 2.7 4.4 5.5 5.5"/><path d="m13 21 4-10 4 10"/><path d="M14.5 17h5"/></symbol>

</html>
